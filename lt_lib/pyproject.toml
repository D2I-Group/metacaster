[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacaster-lt-lib"
version = "0.1.0"
description = "MetaCaster LT-Lib training and evaluation package."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.15.1",
  "scikit-learn==1.6.1",
  "pydantic",
  "einops",
  "openai==2.30.0",
  "python-dotenv==1.0.0",
  "torch==2.5.1",
]

[project.optional-dependencies]
profile = ["torchinfo", "fvcore"]

[dependency-groups]
dev = [
  "ruff>=0.14.0",
]

[project.scripts]
metacaster-lt-lib = "benchmark.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark*", "data*", "models*"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tool"]
extend-exclude = [
  ".venv",
  "dataset",
  "work_dirs",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # Ruff-specific rules
]
ignore = [
  "E501",   # formatter owns wrapping; allow long config/doc strings
  "B008",   # pydantic/argparse defaults are intentional in this repo
  "E741",   # model math code commonly uses b/l/h/e dimension names
  "RUF001", # docs/prompts may contain ambiguous Unicode punctuation
  "RUF002",
  "RUF003",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["benchmark", "data", "models"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
