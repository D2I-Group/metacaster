[project]
name = "metacaster"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.76.0",
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.15.1",
    "matplotlib==3.10.0",
    "statsmodels>=0.14",
    "scikit-learn==1.6.1",
    "pyyaml>=6.0.3",
    "loguru>=0.7.3",
    "datasets>=3.0",
    "huggingface-hub>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["agents", "eval", "generation", "optimizer", "scripts"]
extend-exclude = [
    ".venv",
    "lt_lib",
    "data",
    "work_dir",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["agents", "eval", "generation", "optimizer", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
